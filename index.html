}

  Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',

function makeIcon(name) {
  const p = ICON_PATHS[name];
  return function (props) {
    return <Icon path={p} {...props} />;
  };
}

const Plus = makeIcon("Plus");
const X = makeIcon("X");
const Flame = makeIcon("Flame");

const Link2 = makeIcon("Link2");
const Pencil = makeIcon("Pencil");

const ArchiveRestore = makeIcon("ArchiveRestore");

// Local storage shim matching the {get,set} shape the component expects.
const storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    return raw === null ? null : { key, value: raw };
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

  radial-gradient(900px 520px at 12% -8%, rgba(224,163,57,0.11), transparent 60%),
  radial-gradient(760px 520px at 105% 6%, rgba(92,154,110,0.07), transparent 55%),

function formatWeekday(d) {
  return new Intl.DateTimeFormat("he-IL", { weekday: "long" }).format(d);
}

function formatDateShort(d) {
  return new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long" }).format(d);
}

function formatTime(d) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dateStrDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function chunk(arr, size) {
  const rows = [];
  for (let i = 0; i < arr.length; i += size) rows.push(arr.slice(i, i + size));
  return rows;
}

function dateFromStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function weekdayLetter(dateStr) {
  return new Intl.DateTimeFormat("he-IL", { weekday: "narrow" }).format(dateFromStr(dateStr));
}

function currentStreak(completions) {
  let streak = 0;
  let i = 0;
  while (completions[dateStrDaysAgo(i)]) {
    streak++;
    i++;
  }
  return streak;
}

function longestStreak(completions) {
  const dates = Object.keys(completions).filter((d) => completions[d]).sort();
  if (dates.length === 0) return 0;
  let longest = 1;
  let run = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i - 1]);
    const cur = new Date(dates[i]);
    const diffDays = Math.round((cur - prev) / (1000 * 60 * 60 * 24));
    if (diffDays === 1) {
      run++;
      longest = Math.max(longest, run);
    } else {
      run = 1;
    }
  }
  return longest;
}

function HabitTracker() {
  const [habits, setHabits] = useState(null); // null = loading
  const [error, setError] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [newName, setNewName] = useState("");
  const [newColor, setNewColor] = useState(PALETTE[0].hex);
  const [newTarget, setNewTarget] = useState(50);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [celebrateHabit, setCelebrateHabit] = useState(null);
  const [showArchive, setShowArchive] = useState(false);
  const [tab, setTab] = useState("home"); // "home" | "stats" | "settings"
  const [exportFeedback, setExportFeedback] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  useEffect(() => {
    if (!celebrateHabit) return;
    const t = setTimeout(() => setCelebrateHabit(null), 4000);
    return () => clearTimeout(t);
  }, [celebrateHabit]);

  const [today, setToday] = useState(todayStr());
  const [clockNow, setClockNow] = useState(new Date());

  // Live clock for the header date/time — purely cosmetic, ticks every second.
  useEffect(() => {
    const id = setInterval(() => setClockNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  // Watch the device clock and pick up midnight rollovers without a reload.
  useEffect(() => {
    const id = setInterval(() => {
      const now = todayStr();
      setToday((prev) => (prev !== now ? now : prev));
    }, 30000); // check every 30s — cheap, and a minute of lag past midnight is harmless
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("habits");
        setHabits(result ? JSON.parse(result.value) : []);
      } catch (e) {
        setHabits([]);
      }
    })();
  }, []);

  async function persist(next) {
    setHabits(next);
    try {
      const result = await storage.set("habits", JSON.stringify(next));
      if (!result) setError("השמירה נכשלה, נסה שוב");
      else setError(null);
    } catch (e) {
      setError("השמירה נכשלה, נסה שוב");
    }
  }

  function resetForm() {
    setNewName("");
    setNewColor(PALETTE[0].hex);
    setNewTarget(50);
    setEditingId(null);
    setShowAdd(false);
  }

  function openAddSheet() {
    setEditingId(null);
    setNewName("");
    setNewColor(PALETTE[0].hex);
    setNewTarget(50);
    setShowAdd(true);
  }

  function openEditSheet(habit) {
    setEditingId(habit.id);
    setNewName(habit.name);
    setNewColor(habit.color);
    setNewTarget(habit.target || 50);
    setShowAdd(true);
  }

  function submitHabitForm() {
    const name = newName.trim();
    if (!name) return;
    const target = Number(newTarget) || 50;

    if (editingId) {
      const next = habits.map((h) =>
        h.id === editingId ? { ...h, name, color: newColor, target } : h
      );
      persist(next);
    } else {
      const habit = {
        id: `h_${Date.now()}`,
        name,
        color: newColor,
        target,
        createdAt: today,
        completions: {},
      };
      persist([...(habits || []), habit]);
    }
    resetForm();
  }

  function toggleToday(habitId) {
    const habit = habits.find((h) => h.id === habitId);
    if (!habit) return;
    const wasFilled = !!habit.completions[today];
    const prevProgress = Object.values(habit.completions).filter(Boolean).length;
    const completions = { ...habit.completions };
    if (wasFilled) delete completions[today];
    else completions[today] = true;
    const newProgress = Object.values(completions).filter(Boolean).length;
    const target = habit.target || 50;

    const next = habits.map((h) => (h.id === habitId ? { ...h, completions } : h));
    persist(next);

    if (!wasFilled && prevProgress < target && newProgress >= target) {
      setCelebrateHabit({ name: habit.name, color: habit.color, target });
    }
  }

  function deleteHabit(habitId) {
    persist(habits.filter((h) => h.id !== habitId));
    setConfirmDelete(null);
  }

  function archiveHabit(habitId) {
    persist(habits.map((h) => (h.id === habitId ? { ...h, archived: true } : h)));
  }

  function restoreHabit(habitId) {
    persist(habits.map((h) => (h.id === habitId ? { ...h, archived: false } : h)));
  }

  function exportHabits() {
    try {
      const dataStr = JSON.stringify(habits, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `הרגלים-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setExportFeedback(true);
      setTimeout(() => setExportFeedback(false), 2000);
    } catch (e) {
      setError("הייצוא נכשל, נסה שוב");
    }
  }

  if (habits === null) {
    return (
      <div
        style={{ background: BG, color: TEXT_MUTED, fontFamily: "'IBM Plex Sans', sans-serif" }}
        className="min-h-screen flex items-center justify-center"
      >
        <style>{FONT_IMPORT}</style>
        טוען…
      </div>
    );
  }

  const activeHabits = habits.filter((h) => !h.archived);
  const archivedHabits = habits.filter((h) => h.archived);
  const isCustomColor = !PALETTE.some((c) => c.hex.toLowerCase() === (newColor || "").toLowerCase());

  const totalCheckins = habits.reduce(
    (sum, h) => sum + Object.values(h.completions).filter(Boolean).length,
    0
  );
  const totalGoalsCompleted = habits.filter(
    (h) => Object.values(h.completions).filter(Boolean).length >= (h.target || 50)
  ).length;
  const bestCurrentStreak = habits.length ? Math.max(0, ...habits.map((h) => currentStreak(h.completions))) : 0;
  const weekDays = Array.from({ length: 7 }, (_, i) => dateStrDaysAgo(i)); // today first
  const weekCounts = weekDays.map((d) => habits.filter((h) => h.completions[d]).length);
  const weekMax = Math.max(1, ...weekCounts);
  const rankedHabits = [...habits]
    .map((h) => ({
      ...h,
      progress: Object.values(h.completions).filter(Boolean).length,
      target: h.target || 50,
    }))
    .sort((a, b) => b.progress / b.target - a.progress / a.target)
    .slice(0, 5);

  return (
    <div
      dir="rtl"
      style={{ background: AMBIENT_BG, color: TEXT_MAIN, fontFamily: "'IBM Plex Sans', sans-serif" }}
      className="min-h-screen w-full relative"
    >
      <style>{FONT_IMPORT}</style>

      {/* Subtle paper-grain texture, purely atmospheric */}
      <div
        aria-hidden="true"
        style={{
          position: "fixed",
          inset: 0,
          backgroundImage: NOISE_BG,
          backgroundSize: "140px 140px",
          opacity: 0.035,
          mixBlendMode: "overlay",
          pointerEvents: "none",
        }}
      />

      <div className="relative pb-28">
      {/* Header */}
      <div
        style={{
          background: `linear-gradient(180deg, ${BG_CARD} 0%, transparent 100%)`,
          borderBottom: `1px solid ${BORDER}`,
        }}
        className="px-6 pt-14 pb-9"
      >
        <div className="flex items-start justify-between mb-5">
          <div
            style={{ background: "rgba(224,163,57,0.12)", border: `1px solid ${PALETTE[0].hex}` }}
            className="w-11 h-11 rounded-full flex items-center justify-center"
          >
            <Link2 size={19} color={PALETTE[0].hex} strokeWidth={2.2} />
          </div>

          <div className="text-left" dir="ltr">
            <div
              style={{
                fontFamily: "'Fraunces', serif",
                color: TEXT_MAIN,
                fontVariantNumeric: "tabular-nums",
                letterSpacing: "-0.01em",
              }}
              className="text-2xl font-semibold leading-none"
            >
              {formatTime(clockNow)}
            </div>
            <div
              style={{ color: PALETTE[0].hex, fontFamily: "'IBM Plex Mono', monospace" }}
              className="text-[10px] mt-1.5 uppercase tracking-wide"
            >
              {formatWeekday(clockNow)}
            </div>
            <div style={{ color: TEXT_MUTED, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[10px]">
              {formatDateShort(clockNow)}
            </div>
          </div>
        </div>

        <div className="flex items-center gap-2 mb-2.5">
          <div style={{ width: 16, height: 1, background: TEXT_MUTED, opacity: 0.5 }} />
          <span
            style={{ fontFamily: "'IBM Plex Mono', monospace", color: PALETTE[0].hex, letterSpacing: "0.16em" }}
            className="text-[11px] uppercase"
          >
            יומן הרגלים
          </span>
        </div>

        <h1
          style={{
            fontFamily: "'Fraunces', serif",
            color: TEXT_MAIN,
            letterSpacing: "-0.02em",
            lineHeight: 1.05,
          }}
          className="text-[2.75rem] font-semibold"
        >
          אל תשבור
          <br />
          את ה
          <span style={{ color: PALETTE[0].hex, fontStyle: "italic", fontWeight: 600 }}>שרשרת</span>
        </h1>

        {/* Decorative chain: rings fade from lit to dim, echoing a streak trailing off */}
        <div className="flex items-center" style={{ marginTop: 20 }} aria-hidden="true">
          {Array.from({ length: 12 }).map((_, i) => {
            const vertical = i % 2 === 0;
            const lit = i < 5;
            return (
              <div
                key={i}
                style={{
                  width: vertical ? 13 : 22,
                  height: vertical ? 22 : 13,
                  border: `2.5px solid ${lit ? PALETTE[0].hex : BORDER}`,
                  borderRadius: 9999,
                  marginLeft: i === 0 ? 0 : -7,
                  opacity: lit ? 1 : 0.7,
                  flexShrink: 0,
                }}
              />
            );
          })}
        </div>

        <p style={{ color: TEXT_MUTED }} className="text-sm mt-4 leading-relaxed max-w-[32ch]">
          יעד קטן, חוליה ביום, ובלי לשים לב כבר יש שרשרת שלמה.
        </p>
      </div>

      {/* Top tab bar — segmented control with a sliding highlight */}
      <div
        style={{
          position: "sticky",
          top: 0,
          zIndex: 20,
          background: `${BG}ee`,

                  const v = Number(raw);
                  if (Number.isNaN(v)) return;
                  setNewTarget(Math.min(100, Math.max(1, v)));

                    >
                      {stat.icon && <Flame size={18} strokeWidth={2} />}
                      {stat.trophy && <span style={{ fontSize: 20 }}>🏆</span>}

              {/* Weekly activity */}
              <div
                style={{ background: BG_CARD, border: `1px solid ${BORDER}` }}
                className="rounded-xl px-4 pt-4 pb-3 mb-6"
              >
                <div style={{ color: TEXT_MUTED }} className="text-xs mb-3">

                <div className="flex items-end justify-between gap-2" style={{ height: 88 }}>
                  {weekDays.map((d, i) => {
                    const count = weekCounts[i];
                    const heightPct = Math.round((count / weekMax) * 100);
                    const isToday = d === today;
                    return (
                      <div key={d} className="flex flex-col items-center gap-1.5 flex-1">
                        <div
                          style={{

        <div
          onClick={() => setCelebrateHabit(null)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(9,14,11,0.72)",
            zIndex: 50,
            animation: "overlayFade 0.2s ease-out",
          }}
          className="flex items-center justify-center px-6"
        >
          <div style={{ position: "absolute", inset: 0, overflow: "hidden" }} aria-hidden="true">
            {Array.from({ length: 26 }).map((_, i) => {
              const left = Math.round((i * 137.5) % 100);
              const color = PALETTE[i % PALETTE.length].hex;
              const duration = (1.8 + ((i * 37) % 140) / 100).toFixed(2);
              const delay = (((i * 53) % 60) / 100).toFixed(2);
              const size = 6 + (i % 4) * 2;
              return (
                <span
                  key={i}
                  style={{
                    position: "absolute",
                    top: -24,
                    left: `${left}%`,
                    width: size,
                    height: size * 1.6,
                    background: color,
                    borderRadius: 2,
                    animation: `confettiFall ${duration}s ease-in ${delay}s forwards`,
                  }}
                />
              );
            })}
          </div>

          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: BG_CARD,
              border: `1px solid ${celebrateHabit.color}`,
              boxShadow: `0 0 48px ${celebrateHabit.color}40`,
              animation: "popIn 0.35s cubic-bezier(0.2,0.9,0.3,1.3)",
            }}
            className="rounded-2xl px-6 py-8 text-center max-w-xs w-full relative"
          >
            <div style={{ fontSize: 42 }} className="mb-3">
              🏆
            </div>
            <div
              style={{ fontFamily: "'Fraunces', serif", color: TEXT_MAIN }}
              className="text-xl font-semibold mb-1.5"
            >
              היעד הושלם!
            </div>
            <div style={{ color: celebrateHabit.color, fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm mb-5">
              {celebrateHabit.name} · {celebrateHabit.target}/{celebrateHabit.target}
            </div>
            <button
              onClick={() => setCelebrateHabit(null)}
              style={{ background: celebrateHabit.color, color: "#151F19" }}
              className="rounded-full px-6 py-2 text-sm font-medium"
            >
              יש!
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<HabitTracker />);
} catch (e) {
  document.getElementById("boot-status").textContent = "משהו נכשל בהרצה:\n" + e.message;
}
</script>
</body>
</html>
