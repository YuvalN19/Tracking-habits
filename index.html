const storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    return raw === null ? null : { key, value: raw };
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

function formatWeekday(d) {
  return new Intl.DateTimeFormat("he-IL", { weekday: "long" }).format(d);
}

function formatDateShort(d) {
  return new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long" }).format(d);
}

function formatTime(d) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dateStrDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function chunk(arr, size) {
  const rows = [];
  for (let i = 0; i < arr.length; i += size) rows.push(arr.slice(i, i + size));
  return rows;
}

function dateFromStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function weekdayLetter(dateStr) {
  return new Intl.DateTimeFormat("he-IL", { weekday: "narrow" }).format(dateFromStr(dateStr));
}

function daysBetween(a, b) {
  return Math.round((dateFromStr(b) - dateFromStr(a)) / (1000 * 60 * 60 * 24));
}

function isScheduledDay(habit, dateStr) {
  const days = habit.schedule && habit.schedule.days;
  if (!days || days.length === 0 || days.length === 7) return true;
  return days.includes(dateFromStr(dateStr).getDay());
}

function currentStreak(habit) {
  const completions = habit.completions || {};
  const freezes = habit.freezes || {};
  let streak = 0;
  let i = 0;
  while (true) {
    const d = dateStrDaysAgo(i);
    if (!isScheduledDay(habit, d)) {
      i++;
      continue;
    }
    if (completions[d] || freezes[d]) {
      streak++;
      i++;
    } else {
      break;
    }
  }
  return streak;
}

function longestStreak(habit) {
  const completions = habit.completions || {};
  const freezes = habit.freezes || {};
  const created = habit.createdAt || todayStr();
  const span = Math.max(0, daysBetween(created, todayStr()));
  let longest = 0;
  let run = 0;
  for (let i = span; i >= 0; i--) {
    const d = dateStrDaysAgo(i);
    if (!isScheduledDay(habit, d)) continue;
    if (completions[d] || freezes[d]) {
      run++;
      if (run > longest) longest = run;
    } else {
      run = 0;
    }
  }
  return longest;
}

  useEffect(() => {
    const id = setInterval(() => {
      const now = todayStr();
      setToday((prev) => (prev !== now ? now : prev));
    }, 30000); // check every 30s — cheap, and a minute of lag past midnight is harmless
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("habits");
        setHabits(result ? JSON.parse(result.value) : []);
      } catch (e) {
        setHabits([]);
      }
    })();
  }, []);

  async function persist(next) {
    setHabits(next);
    try {
      const result = await storage.set("habits", JSON.stringify(next));
      if (!result) setError("השמירה נכשלה, נסה שוב");
      else setError(null);
    } catch (e) {
      setError("השמירה נכשלה, נסה שוב");
    }
  }

  function resetForm() {
    setNewName("");
    setNewColor(PALETTE[0].hex);
    setNewTarget(50);
    setNewPurpose("");
    setNewEmoji(EMOJI_OPTIONS[0]);
    setNewScheduleDays(ALL_DAYS);
    setEditingId(null);
    setShowAdd(false);
    setShowEmojiPicker(false);
  }

  function openAddSheet() {
    setEditingId(null);
    setNewName("");
    setNewColor(PALETTE[0].hex);
    setNewTarget(50);
    setNewPurpose("");
    setNewEmoji(EMOJI_OPTIONS[0]);
    setNewScheduleDays(ALL_DAYS);
    setShowAdd(true);
  }

  function openEditSheet(habit) {
    setEditingId(habit.id);
    setNewName(habit.name);
    setNewColor(habit.color);
    setNewTarget(habit.target || 50);
    setNewPurpose(habit.purpose || "");
    setNewEmoji(habit.emoji || EMOJI_OPTIONS[0]);
    setNewScheduleDays((habit.schedule && habit.schedule.days && habit.schedule.days.length) ? habit.schedule.days : ALL_DAYS);
    setShowAdd(true);
  }

  function toggleScheduleDay(day) {
    setNewScheduleDays((prev) => {
      if (prev.length === 7) {
        // Currently "every day" — tapping a specific day starts a fresh custom selection
        // with just that day, instead of merely removing it from the full week.
        return [day];
      }
      if (prev.includes(day)) {
        const next = prev.filter((d) => d !== day);
        return next.length === 0 ? prev : next; // keep at least one day selected
      }
      return [...prev, day].sort();
    });
  }

  function submitHabitForm() {
    const name = newName.trim();
    if (!name) return;
    const target = Number(newTarget) || 50;
    const purpose = newPurpose.trim();
    const schedule = { days: [...newScheduleDays].sort() };

    if (editingId) {
      const next = habits.map((h) =>
        h.id === editingId ? { ...h, name, color: newColor, target, purpose, emoji: newEmoji, schedule } : h
      );
      persist(next);
    } else {
      const habit = {
        id: `h_${Date.now()}`,
        name,
        color: newColor,
        target,
        purpose,
        emoji: newEmoji,
        schedule,
        createdAt: today,
        completions: {},
        freezes: {},
      };
      persist([...(habits || []), habit]);
    }
    resetForm();
  }

  function toggleToday(habitId) {
    const habit = habits.find((h) => h.id === habitId);
    if (!habit) return;
    const wasFilled = !!habit.completions[today];
    const prevProgress = Object.values(habit.completions).filter(Boolean).length;
    const completions = { ...habit.completions };
    if (wasFilled) delete completions[today];
    else completions[today] = true;
    const newProgress = Object.values(completions).filter(Boolean).length;
    const target = habit.target || 50;

    // Marking a day complete cancels any "day off" freeze on that same day.
    const freezes = { ...(habit.freezes || {}) };
    if (!wasFilled) delete freezes[today];

    const next = habits.map((h) => (h.id === habitId ? { ...h, completions, freezes } : h));
    persist(next);

    if (!wasFilled && prevProgress < target && newProgress >= target) {
      setCelebrateHabit({ name: habit.name, color: habit.color, target });
    }
  }

  function toggleFreeze(habitId) {
    const habit = habits.find((h) => h.id === habitId);
    if (!habit) return;
    if (habit.completions[today]) return; // can't freeze an already-completed day
    const freezes = { ...(habit.freezes || {}) };
    if (freezes[today]) delete freezes[today];
    else freezes[today] = true;
    persist(habits.map((h) => (h.id === habitId ? { ...h, freezes } : h)));
  }

  function deleteHabit(habitId) {
    persist(habits.filter((h) => h.id !== habitId));
    setConfirmDelete(null);
  }

  function archiveHabit(habitId) {
    persist(habits.map((h) => (h.id === habitId ? { ...h, archived: true } : h)));
  }

  function restoreHabit(habitId) {
    persist(habits.map((h) => (h.id === habitId ? { ...h, archived: false } : h)));
  }

  function exportHabits() {
    try {
      const dataStr = JSON.stringify(habits, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `הרגלים-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setExportFeedback(true);
      setTimeout(() => setExportFeedback(false), 2000);
    } catch (e) {

  }

  const totalCheckins = habits.reduce(

  const totalGoalsCompleted = habits.filter(

  const bestCurrentStreak = habits.length ? Math.max(0, ...habits.map((h) => currentStreak(h))) : 0;
  const bestEverStreak = habits.length ? Math.max(0, ...habits.map((h) => longestStreak(h))) : 0;
  const badgeStats = {
    habitCount: habits.length,
    totalCheckins,
    goalsCompleted: totalGoalsCompleted,
    bestEverStreak,
    activeCount: activeHabits.length,
    archivedCount: archivedHabits.length,
  };
  const unlockedBadgeCount = BADGES.filter((b) => b.check(badgeStats)).length;
  const weekDays = Array.from({ length: 7 }, (_, i) => dateStrDaysAgo(i)); // today first
  const weekCounts = weekDays.map((d) => habits.filter((h) => h.completions[d]).length);
  const weekMax = Math.max(1, ...weekCounts);
  const rankedHabits = [...habits]
    .map((h) => ({
      ...h,
      progress: Object.values(h.completions).filter(Boolean).length,
      target: h.target || 50,

    .slice(0, 5);

      <div aria-hidden="true" style={{ position: "fixed", inset: 0, overflow: "hidden", pointerEvents: "none" }}>
        <div

            position: "absolute",
            top: "-14%",
            left: "50%",
            width: 340,

            borderRadius: "9999px",

        />
        <div

            animation: "blobDriftA 14s ease-in-out infinite",

        />
        <div
          style={{

            background: PALETTE[1].hex,

        <div

        <div

        <div

              >

      {tab === "home" ? (

      {error && (

        {activeHabits.length === 0 && !showAdd && (

      {celebrateHabit && (
        <div
          onClick={() => setCelebrateHabit(null)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(9,14,11,0.72)",
            zIndex: 50,
            animation: "overlayFade 0.2s ease-out",
          }}
          className="flex items-center justify-center px-6"
        >
          <div style={{ position: "absolute", inset: 0, overflow: "hidden" }} aria-hidden="true">
            {Array.from({ length: 26 }).map((_, i) => {
              const left = Math.round((i * 137.5) % 100);
              const color = PALETTE[i % PALETTE.length].hex;
              const duration = (1.8 + ((i * 37) % 140) / 100).toFixed(2);
              const delay = (((i * 53) % 60) / 100).toFixed(2);
              const size = 6 + (i % 4) * 2;
              return (
                <span
                  key={i}
                  style={{
                    position: "absolute",
                    top: -24,
                    left: `${left}%`,
                    width: size,
                    height: size * 1.6,
                    background: color,
                    borderRadius: 2,
                    animation: `confettiFall ${duration}s ease-in ${delay}s forwards`,
                  }}
                />
              );
            })}
          </div>

          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: BG_CARD,
              border: `1px solid ${celebrateHabit.color}`,
              boxShadow: `0 0 48px ${celebrateHabit.color}40`,
              animation: "popIn 0.35s cubic-bezier(0.2,0.9,0.3,1.3)",
            }}
            className="rounded-2xl px-6 py-8 text-center max-w-xs w-full relative"
          >
            <div style={{ fontSize: 42 }} className="mb-3">
              🏆
            </div>
            <div
              style={{ fontFamily: "'Fraunces', serif", color: TEXT_MAIN }}
              className="text-xl font-semibold mb-1.5"
            >
              היעד הושלם!
            </div>
            <div style={{ color: celebrateHabit.color, fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm mb-5">
              {celebrateHabit.name} · {celebrateHabit.target}/{celebrateHabit.target}
            </div>
            <button
              onClick={() => setCelebrateHabit(null)}
              style={{ background: celebrateHabit.color, color: "#151F19" }}
              className="rounded-full px-6 py-2 text-sm font-medium tap-3d"
            >
              יש!
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<HabitTracker />);
} catch (e) {
  document.getElementById("boot-status").textContent = "משהו נכשל בהרצה:\n" + e.message;
}
</script>
</body>
</html>
